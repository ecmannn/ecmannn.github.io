# Location captions for the photo gallery lightbox.
#
# Keys are the photo's filename without extension (e.g. 01_hiking), grouped by
# gallery section. Fill in a location string and it shows as a tag under the
# photo in the lightbox on /fun-stuff/photos/. Leave the value as "" (empty) to
# show no tag for that photo. Free text -- write it however reads best.
#
# The published photos have no GPS (the prep script strips all EXIF). These
# values were AUTO-SEEDED by reverse-geocoding the originals' GPS (OSM Overpass
# for parks/protected areas, Nominatim for urban points) and are DRAFTS to
# hand-correct. Adding a photo later? Add a line here with its basename.

